services:
  - type: web
    name: api-modulo8
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: api-modulo8-db
          property: connectionString
      - key: PORT
        value: 3000
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: api-modulo8-db
    plan: free
    databaseName: api_modulo8
    user: api_modulo8_user
