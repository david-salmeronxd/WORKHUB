services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workhub
      POSTGRES_USER: workhub
      POSTGRES_PASSWORD: workhub_dev_password
    ports:
      - "5432:5432"
    volumes:
      - workhub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workhub -d workhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://workhub:workhub_dev_password@db:5432/workhub
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: '*'
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  workhub_data: